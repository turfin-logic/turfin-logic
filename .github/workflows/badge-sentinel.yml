name: Badge Sentinel & Self-Healing

on:
  schedule:
    # Run every 12 hours to verify badge availability and Camo health
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "README.md"

jobs:
  health-check-and-heal:
    name: Check & Self-Heal Profile Badges
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run Badge Sentinel
        id: sentinel
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python .github/scripts/badge_sentinel.py

      - name: Commit & Push Healed Badges
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            echo "[*] Changes detected in README.md. Committing fix..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "fix(badges): auto-heal broken profile badge [skip ci]"
            git push origin HEAD
          else
            echo "[*] No healing required. All badges are operational."
          fi
